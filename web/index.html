<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Party</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Dino Party game">
        <div class="topbar">
          <div class="brand">Dino Party</div>
          <div class="stats" aria-live="polite">
            <span id="score">00000</span>
            <span id="hiScore">HI 00000</span>
            <span id="mode">SOLO</span>
            <span id="status">offline</span>
          </div>
        </div>
        <canvas id="game" width="960" height="300"></canvas>
        <div class="controls">
          <span>Space / Up: jump</span>
          <span>Down: duck</span>
          <span>Open another tab/device to join</span>
          <span>R: restart</span>
        </div>
      </section>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
